[package]
name = "pty_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/pty_server.rs"
doctest = false

[[bin]]
name = "pty-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
log.workspace = true
vt100 = "0.16"

[dev-dependencies]
tempfile.workspace = true
